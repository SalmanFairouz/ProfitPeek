name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t profitpeak-backend .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t profitpeak-frontend .
